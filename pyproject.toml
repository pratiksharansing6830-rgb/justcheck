[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-fraud-strategy-validation"
version = "0.1.0"
description = "Dataset-agnostic foundations for fraud strategy validation"
requires-python = ">=3.10"
dependencies =  [
    "fastapi>=0.110",
    "pandas>=2.0",
    "pydantic>=2.0",
    "uvicorn>=0.27",
    "xgboost>=2.0",
    "scikit-learn>=1.3"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
